48" height="153" rx="17" fill="url(#card)" stroke="#2B435B" stroke-width="1" /><rect x="53" y="180" width="348" height="5" rx="3" fill="#54E6D5" stroke="none" stroke-width="1" /><text x="76" y="220" fill="#54E6D5" font-size="14" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">01</text><text x="76" y="254" fill="#F2F7FF" font-size="22" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">ENGINEERING</text><text x="76" y="284" fill="#94ACC3" font-size="13" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">From desktop to full-stack web applications,</text><text x="76" y="306" fill="#94ACC3" font-size="13" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">I turn real needs into maintainable software.</text><rect x="424" y="180" width="348" height="153" rx="17" fill="url(#card)" stroke="#2B435B" stroke-width="1" /><rect x="424" y="180" width="348" height="5" rx="3" fill="#77AFFF" stroke="none" stroke-width="1" /><text x="447" y="220" fill="#77AFFF" font-size="14" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">02</text><text x="447" y="254" fill="#F2F7FF" font-size="22" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">INTELLIGENCE</text><text x="447" y="284" fill="#94ACC3" font-size="13" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">Exploring AI in education and business</text><text x="447" y="306" fill="#94ACC3" font-size="13" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">to make everyday workflows more useful.</text><rect x="795" y="180" width="348" height="153" rx="17" fill="url(#card)" stroke="#2B435B" stroke-width="1" /><rect x="795" y="180" width="348" height="5" rx="3" fill="#B79BFF" stroke="none" stroke-width="1" /><text x="818" y="220" fill="#B79BFF" font-size="14" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">03</text><text x="818" y="254" fill="#F2F7FF" font-size="22" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">EXPERIENCE</text><text x="818" y="284" fill="#94ACC3" font-size="13" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">Interfaces should feel clear and intuitive,</text><text x="818" y="306" fill="#94ACC3" font-size="13" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">not just function behind the scenes.</text><text x="55" y="359" fill="#94ACC3" font-size="13" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif" opacity="1">Currently: building Thakerli and Maalivo  •  exploring AgenticRental</text></svg>